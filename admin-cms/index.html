<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chubby Baker & Co — Admin</title>
<style>
  :root{ --berry:#A63F53; --cocoa:#5C3A28; --cream:#FBF1E1; --line:#e6d9c6; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#faf6ef; color:var(--cocoa); }
  header{ background:var(--cocoa); color:#fff; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
  header h1{ font-size:1.1rem; margin:0; }
  header button{ background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff; padding:6px 14px; border-radius:8px; cursor:pointer; font-size:.85rem; }
  main{ max-width:760px; margin:0 auto; padding:20px 16px 80px; }
  .hidden{ display:none !important; }

  /* login */
  #loginBox{ max-width:340px; margin:60px auto; text-align:center; }
  #loginBox input{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:1rem; margin-bottom:12px; }
  #loginBox button{ width:100%; padding:12px; border:none; border-radius:10px; background:var(--berry); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
  #loginError{ color:#b3261e; font-size:.85rem; margin-top:10px; min-height:18px; }

  /* tabs */
  .tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tab-btn{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; font-weight:700; color:var(--cocoa); }
  .tab-btn.active{ background:var(--berry); color:#fff; border-color:var(--berry); }

  /* menu editor */
  .category-card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px; }
  .category-card > input.cat-name{ font-weight:700; font-size:1.05rem; border:none; border-bottom:2px solid var(--line); width:100%; padding:4px 0; margin-bottom:10px; background:transparent; }
  .item-row{ display:grid; grid-template-columns: 1fr 70px 80px 30px; gap:6px; margin-bottom:8px; align-items:center; }
  .item-row input{ padding:8px; border:1px solid var(--line); border-radius:8px; font-size:.85rem; width:100%; }
  .item-row button{ background:none; border:none; color:#b3261e; font-size:1.1rem; cursor:pointer; }
  .small-btn{ font-size:.8rem; padding:6px 12px; border-radius:8px; border:1px dashed var(--line); background:none; color:var(--cocoa); cursor:pointer; }
  .del-cat{ float:right; background:none; border:none; color:#b3261e; cursor:pointer; font-size:.85rem; }

  .save-bar{ position:sticky; bottom:0; background:#faf6ef; padding:14px 0; border-top:1px solid var(--line); display:flex; gap:10px; }
  .save-bar button{ flex:1; padding:14px; border:none; border-radius:10px; font-weight:700; cursor:pointer; }
  .save-bar .primary{ background:var(--berry); color:#fff; }
  .save-bar .secondary{ background:#fff; border:1px solid var(--line); color:var(--cocoa); }
  #toast{ position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--cocoa); color:#fff; padding:10px 18px; border-radius:999px; font-size:.85rem; opacity:0; transition:opacity .25s ease; pointer-events:none; }
  #toast.show{ opacity:1; }

  /* gallery editor */
  .photo-card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px; display:flex; gap:12px; }
  .photo-card img{ width:90px; height:90px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  .photo-fields{ flex:1; display:flex; flex-direction:column; gap:6px; }
  .photo-fields input, .photo-fields select{ padding:7px 8px; border:1px solid var(--line); border-radius:8px; font-size:.85rem; }
  .photo-actions{ display:flex; gap:8px; margin-top:2px; }
  .photo-actions button{ font-size:.78rem; padding:6px 10px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .photo-actions .save-photo{ background:var(--berry); color:#fff; border-color:var(--berry); }
  .photo-actions .del-photo{ color:#b3261e; }

  .upload-card{ background:var(--cream); border:1px dashed var(--berry); border-radius:12px; padding:16px; margin-bottom:20px; }
  .upload-card h3{ margin:0 0 10px; font-size:1rem; }
  .upload-card input, .upload-card select{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; font-size:.9rem; }
  .upload-card button{ width:100%; padding:12px; border:none; border-radius:10px; background:var(--berry); color:#fff; font-weight:700; cursor:pointer; }
  .status-line{ font-size:.8rem; color:var(--cocoa); margin-top:6px; min-height:16px; }
</style>
</head>
<body>

<header>
  <h1>🧁 Chubby Baker &amp; Co — Admin</h1>
  <button id="logoutBtn" class="hidden">Log out</button>
</header>

<main>
  <div id="loginBox">
    <p style="margin-bottom:16px; color:#8a7460;">Enter the admin password to continue</p>
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Log In</button>
    <div id="loginError"></div>
  </div>

  <div id="appBox" class="hidden">
    <div class="tabs">
      <button class="tab-btn active" data-tab="menu">Menu</button>
      <button class="tab-btn" data-tab="gallery">Gallery &amp; Occasions</button>
    </div>

    <section id="menuTab">
      <div id="menuCategories"></div>
      <button class="small-btn" id="addCategoryBtn">+ Add Category</button>
      <div class="save-bar">
        <button class="secondary" id="reloadMenuBtn">Reload</button>
        <button class="primary" id="saveMenuBtn">Save Menu</button>
      </div>
    </section>

    <section id="galleryTab" class="hidden">
      <div class="upload-card">
        <h3>Upload New Photo</h3>
        <input type="file" id="uploadFile" accept="image/*">
        <input type="text" id="uploadCaption" placeholder="Caption (e.g. Red Velvet Birthday Cake)">
        <select id="uploadCategory">
          <option value="">— No occasion tag —</option>
          <option>Birthday</option>
          <option>Bachelorette & Bridal</option>
          <option>Artistic & Custom</option>
          <option>Kids & Fun</option>
          <option>Everyday Treats</option>
        </select>
        <button id="uploadBtn">Upload Photo</button>
        <div class="status-line" id="uploadStatus"></div>
      </div>
      <div id="photoList"></div>
    </section>
  </div>

  <div id="toast"></div>
</main>

<script>
var CATEGORY_OPTIONS = ['Birthday', 'Bachelorette & Bridal', 'Artistic & Custom', 'Kids & Fun', 'Everyday Treats'];
var SITE_BASE_URL = 'https://itsadityaprasad09-hub.github.io/chubby-baker-co/';

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2200);
}

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  opts.credentials = 'same-origin';
  return fetch(path, opts).then(function (r) {
    return r.json().then(function (data) {
      if (!r.ok) throw new Error(data.error || ('Request failed: ' + r.status));
      return data;
    });
  });
}

/* ---------------- login ---------------- */
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('passwordInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') doLogin();
});

function doLogin() {
  var pw = document.getElementById('passwordInput').value;
  var errEl = document.getElementById('loginError');
  errEl.textContent = '';
  api('/api/login', { method: 'POST', body: JSON.stringify({ password: pw }) })
    .then(function () { showApp(); })
    .catch(function (e) { errEl.textContent = e.message; });
}

function showApp() {
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('appBox').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
  loadMenu();
  loadGallery();
}

document.getElementById('logoutBtn').addEventListener('click', function () {
  api('/api/logout', { method: 'POST' }).then(function () { location.reload(); });
});

/* ---------------- tabs ---------------- */
document.querySelectorAll('.tab-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    var tab = btn.getAttribute('data-tab');
    document.getElementById('menuTab').classList.toggle('hidden', tab !== 'menu');
    document.getElementById('galleryTab').classList.toggle('hidden', tab !== 'gallery');
  });
});

/* ---------------- menu editor ---------------- */
var currentMenu = [];

function loadMenu() {
  api('/api/menu').then(function (data) {
    currentMenu = data.menu || [];
    renderMenu();
  }).catch(function (e) {
    if (e.message.indexOf('authenticated') !== -1) { location.reload(); return; }
    toast('Could not load menu: ' + e.message);
  });
}

function renderMenu() {
  var wrap = document.getElementById('menuCategories');
  wrap.innerHTML = '';
  currentMenu.forEach(function (cat, ci) {
    var card = document.createElement('div');
    card.className = 'category-card';

    var nameInput = document.createElement('input');
    nameInput.className = 'cat-name';
    nameInput.value = cat.category;
    nameInput.addEventListener('input', function () { currentMenu[ci].category = nameInput.value; });

    var delCatBtn = document.createElement('button');
    delCatBtn.className = 'del-cat';
    delCatBtn.textContent = 'Delete Category';
    delCatBtn.addEventListener('click', function () {
      if (confirm('Delete category "' + cat.category + '" and all its items?')) {
        currentMenu.splice(ci, 1);
        renderMenu();
      }
    });

    card.appendChild(nameInput);
    card.appendChild(delCatBtn);

    var itemsWrap = document.createElement('div');
    itemsWrap.style.clear = 'both';
    itemsWrap.style.marginTop = '8px';

    cat.items.forEach(function (item, ii) {
      itemsWrap.appendChild(buildItemRow(cat, ci, item, ii));
    });
    card.appendChild(itemsWrap);

    var addItemBtn = document.createElement('button');
    addItemBtn.className = 'small-btn';
    addItemBtn.textContent = '+ Add Item';
    addItemBtn.addEventListener('click', function () {
      currentMenu[ci].items.push({ name: '', qty: '', price: 0 });
      renderMenu();
    });
    card.appendChild(addItemBtn);

    wrap.appendChild(card);
  });
}

function buildItemRow(cat, ci, item, ii) {
  var row = document.createElement('div');
  row.className = 'item-row';

  var nameInput = document.createElement('input');
  nameInput.placeholder = 'Item name';
  nameInput.value = item.name;
  nameInput.addEventListener('input', function () { currentMenu[ci].items[ii].name = nameInput.value; });

  var qtyInput = document.createElement('input');
  qtyInput.placeholder = 'Qty';
  qtyInput.value = item.qty || '';
  qtyInput.addEventListener('input', function () { currentMenu[ci].items[ii].qty = qtyInput.value; });

  var priceInput = document.createElement('input');
  priceInput.placeholder = '₹';
  priceInput.type = 'number';
  priceInput.value = item.price;
  priceInput.addEventListener('input', function () { currentMenu[ci].items[ii].price = Number(priceInput.value) || 0; });

  var delBtn = document.createElement('button');
  delBtn.textContent = '✕';
  delBtn.addEventListener('click', function () {
    currentMenu[ci].items.splice(ii, 1);
    renderMenu();
  });

  row.appendChild(nameInput);
  row.appendChild(qtyInput);
  row.appendChild(priceInput);
  row.appendChild(delBtn);
  return row;
}

document.getElementById('addCategoryBtn').addEventListener('click', function () {
  currentMenu.push({ category: 'New Category', items: [] });
  renderMenu();
});

document.getElementById('reloadMenuBtn').addEventListener('click', loadMenu);

document.getElementById('saveMenuBtn').addEventListener('click', function () {
  api('/api/menu', { method: 'POST', body: JSON.stringify({ menu: currentMenu }) })
    .then(function () { toast('Menu saved — live in ~1 min'); })
    .catch(function (e) { toast('Save failed: ' + e.message); });
});

/* ---------------- gallery + occasions editor ---------------- */
var currentGallery = [];
var currentOccasions = [];

function loadGallery() {
  api('/api/gallery').then(function (data) {
    currentGallery = data.gallery || [];
    currentOccasions = data.occasions || [];
    renderGallery();
  }).catch(function (e) {
    if (e.message.indexOf('authenticated') !== -1) { location.reload(); return; }
    toast('Could not load gallery: ' + e.message);
  });
}

function categoryFor(url) {
  var match = currentOccasions.find(function (o) { return o.url === url; });
  return match ? match.category : '';
}

function renderGallery() {
  var wrap = document.getElementById('photoList');
  wrap.innerHTML = '';
  currentGallery.forEach(function (photo) {
    var card = document.createElement('div');
    card.className = 'photo-card';

    var img = document.createElement('img');
    img.src = SITE_BASE_URL + photo.url;
    card.appendChild(img);

    var fields = document.createElement('div');
    fields.className = 'photo-fields';

    var captionInput = document.createElement('input');
    captionInput.value = photo.caption || '';
    captionInput.placeholder = 'Caption';

    var catSelect = document.createElement('select');
    var noneOpt = document.createElement('option');
    noneOpt.value = ''; noneOpt.textContent = '— No occasion tag —';
    catSelect.appendChild(noneOpt);
    CATEGORY_OPTIONS.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      if (categoryFor(photo.url) === c) opt.selected = true;
      catSelect.appendChild(opt);
    });

    var actions = document.createElement('div');
    actions.className = 'photo-actions';

    var saveBtn = document.createElement('button');
    saveBtn.className = 'save-photo';
    saveBtn.textContent = 'Save';
    saveBtn.addEventListener('click', function () {
      api('/api/gallery', {
        method: 'POST',
        body: JSON.stringify({ action: 'updateCaption', url: photo.url, caption: captionInput.value, category: catSelect.value })
      }).then(function () { toast('Updated'); loadGallery(); })
        .catch(function (e) { toast('Failed: ' + e.message); });
    });

    var delBtn = document.createElement('button');
    delBtn.className = 'del-photo';
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', function () {
      if (!confirm('Remove this photo from the site?')) return;
      api('/api/gallery', {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', url: photo.url, deleteImageFile: true })
      }).then(function () { toast('Removed'); loadGallery(); })
        .catch(function (e) { toast('Failed: ' + e.message); });
    });

    actions.appendChild(saveBtn);
    actions.appendChild(delBtn);

    fields.appendChild(captionInput);
    fields.appendChild(catSelect);
    fields.appendChild(actions);
    card.appendChild(fields);
    wrap.appendChild(card);
  });
}

/* client-side resize so uploads stay small & fast (matches site's mobile-speed setup) */
function resizeImageFile(file, maxDim, quality) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        if (Math.max(w, h) > maxDim) {
          var scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('uploadBtn').addEventListener('click', function () {
  var fileInput = document.getElementById('uploadFile');
  var status = document.getElementById('uploadStatus');
  var file = fileInput.files[0];
  if (!file) { status.textContent = 'Choose a photo first.'; return; }

  status.textContent = 'Resizing...';
  resizeImageFile(file, 1600, 0.8).then(function (dataUrl) {
    status.textContent = 'Uploading...';
    var caption = document.getElementById('uploadCaption').value;
    var category = document.getElementById('uploadCategory').value;
    var filename = file.name.replace(/\.[^.]+$/, '') + '.jpg';
    return api('/api/gallery', {
      method: 'POST',
      body: JSON.stringify({ action: 'upload', filename: filename, imageBase64: dataUrl, caption: caption, category: category })
    });
  }).then(function () {
    status.textContent = 'Uploaded — live in ~1 min';
    document.getElementById('uploadCaption').value = '';
    fileInput.value = '';
    loadGallery();
  }).catch(function (e) {
    status.textContent = 'Failed: ' + e.message;
  });
});
</script>
</body>
</html>
