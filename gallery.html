</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<nav class="top-nav" style="position:relative; background:var(--cocoa);">
  <span class="logo">Chubby Baker &amp; Co</span>
  <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="navPanel">☰</button>
</nav>

<div class="nav-scrim" id="navScrim"></div>
<aside class="nav-panel" id="navPanel" aria-hidden="true">
  <button class="close-btn" id="navClose" aria-label="Close menu">✕</button>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About Us</a></li>

  </ul>
</aside>

<main id="main">
<header class="page-hero">
  <div class="container">
    <span class="kicker">Fresh From The Kitchen</span>
    <h1>Gallery</h1>
    <p>Photos coming soon</p>
  </div>
</header>

<div class="gallery-grid reveal" id="galleryGrid"></div>
<p class="gallery-note" id="galleryNote">Real photos will be added here soon. In the meantime, follow <a class="underline-link" href="https://www.instagram.com/chubbybakerco/" target="_blank" rel="noopener">@chubbybakerco</a> on Instagram.</p>
</main>

<a class="whatsapp-fab" href="https://wa.me/919167072309?text=Hi!%20I'd%20like%20to%20enquire%20about%20a%20cake." target="_blank" rel="noopener" aria-label="Order on WhatsApp">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.09-1.33A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.6 0-3.1-.42-4.4-1.16l-.31-.18-3.02.79.8-2.94-.2-.32A7.94 7.94 0 014 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/></svg>
</a>

<script src="assets/main.js"></script>
<script>
  fetch('data/gallery.json?t=' + Date.now())
    .then(r => r.json())
    .then(photos => {
      const grid = document.getElementById('galleryGrid');
      const note = document.getElementById('galleryNote');
      if(!photos.length){
        grid.innerHTML = Array(6).fill('<div class="gallery-empty">Photo coming soon</div>').join('');
        return;
      }
      note.style.display = 'none';
      grid.innerHTML = photos.map(p => `
        <figure style="margin:0;">
          <img src="${p.url}" alt="${p.caption || 'Chubby Baker & Co'}" style="width:100%; aspect-ratio:4/5; object-fit:cover; display:block;">
          ${p.caption ? `<figcaption style="text-align:center; font-size:.8rem; margin-top:6px; color:var(--cocoa-soft);">${p.caption}</figcaption>` : ''}
        </figure>`).join('');
    })
    .catch(() => {
      document.getElementById('galleryGrid').innerHTML = Array(6).fill('<div class="gallery-empty">Photo coming soon</div>').join('');
    });
</script>

</body>
</html>
