<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Chubby Baker & Co</title>
<meta name="description" content="Photo gallery — Chubby Baker & Co, Bandra West, Mumbai.">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="top-nav" style="position:relative; background:var(--cocoa);">
  <a href="index.html" style="display:flex; align-items:center;"><img src="assets/logo.png" alt="Chubby Baker & Co logo" class="logo-img"></a>
  <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="navPanel">☰</button>
</nav>

<div class="nav-scrim" id="navScrim"></div>
<aside class="nav-panel" id="navPanel" aria-hidden="true">
  <button class="close-btn" id="navClose" aria-label="Close menu">✕</button>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About Us</a></li>
    <li><a href="menu.html">Menu</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="https://wa.me/919167072309" target="_blank" rel="noopener">Order</a></li>
  </ul>
</aside>

<header class="page-hero">
  <div class="container">
    <h1>Gallery</h1>
    <p>Photos coming soon</p>
  </div>
</header>

<div class="gallery-grid" id="galleryGrid"></div>
<p class="gallery-note" id="galleryNote">Real photos will be added here soon. In the meantime, follow <a class="underline-link" href="https://www.instagram.com/chubbybakerco/" target="_blank" rel="noopener">@chubbybakerco</a> on Instagram.</p>

<script>
  var toggle = document.getElementById('navToggle');
  var panel = document.getElementById('navPanel');
  var scrim = document.getElementById('navScrim');
  var closeBtn = document.getElementById('navClose');
  function openNav(){ panel.classList.add('open'); scrim.classList.add('open'); toggle.setAttribute('aria-expanded','true'); panel.setAttribute('aria-hidden','false'); }
  function closeNav(){ panel.classList.remove('open'); scrim.classList.remove('open'); toggle.setAttribute('aria-expanded','false'); panel.setAttribute('aria-hidden','true'); }
  toggle.addEventListener('click', openNav);
  closeBtn.addEventListener('click', closeNav);
  scrim.addEventListener('click', closeNav);

  fetch('data/gallery.json?t=' + Date.now())
    .then(r => r.json())
    .then(photos => {
      const grid = document.getElementById('galleryGrid');
      const note = document.getElementById('galleryNote');
      if(!photos.length){
        grid.innerHTML = Array(6).fill('<div class="gallery-empty">Photo coming soon</div>').join('');
        return;
      }
      note.style.display = 'none';
      grid.innerHTML = photos.map(p => `
        <figure style="margin:0;">
          <img src="${p.url}" alt="${p.caption || 'Chubby Baker & Co'}" style="width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:10px;">
          ${p.caption ? `<figcaption style="text-align:center; font-size:.8rem; margin-top:6px; color:var(--cocoa-soft);">${p.caption}</figcaption>` : ''}
        </figure>`).join('');
    })
    .catch(() => {
      document.getElementById('galleryGrid').innerHTML = Array(6).fill('<div class="gallery-empty">Photo coming soon</div>').join('');
    });
</script>

</body>
</html>
